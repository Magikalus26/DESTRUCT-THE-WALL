<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>DESTRUCT THE WALL — L'Évasion Commence Ici</title>
  <meta
    name="description"
    content="DESTRUCT THE WALL : jeu d'évasion et de destruction incrémentale à la première personne en micro-voxels 3D. Creusez à travers 5 enceintes pour retrouver la liberté."
  />

  <!-- PWA & iOS Safari Home Screen Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DESTRUCT THE WALL" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0e1218" />

  <link rel="icon" type="image/jpeg" href="./assets/icon.jpg" />
  <link rel="apple-touch-icon" href="./assets/icon.jpg" />
  <link rel="manifest" href="./manifest.json" />

  <!-- Fallback Import Map for raw static serving without bundler -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>

  <!-- Global Early Crash Guard: never leave a silent black screen -->
  <script>
    (function () {
      function showBootError(title, detail) {
        var box = document.getElementById('fatal-error-overlay');
        if (!box) {
          box = document.createElement('div');
          box.id = 'fatal-error-overlay';
          box.style.cssText =
            'position:fixed;inset:0;z-index:9999;background:rgba(12,16,24,0.94);color:#f8fafc;' +
            'display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,sans-serif;';
          document.body && document.body.appendChild(box);
        }
        if (!box.parentNode && document.body) document.body.appendChild(box);
        box.innerHTML =
          '<div style="max-width:360px;width:100%;background:#1e2633;border:2px solid #ef4444;border-radius:14px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,0.7);">' +
          '<div style="font-weight:800;font-size:16px;color:#fca5a5;margin-bottom:8px;">⚠️ ' + title + '</div>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#e2e8f0;background:#0f141d;padding:10px;border-radius:8px;max-height:220px;overflow:auto;">' +
          String(detail || 'Erreur inconnue').replace(/</g, '&lt;') +
          '</pre>' +
          '<button onclick="location.reload()" style="margin-top:12px;width:100%;padding:10px;border:none;border-radius:10px;background:#f97316;color:#fff;font-weight:800;font-size:14px;cursor:pointer;">RECHARGER LE JEU</button>' +
          '</div>';
      }
      window.__showBootError = showBootError;
      window.onerror = function (msg, src, line, col, err) {
        var detail = (err && err.stack) ? err.stack : (msg + ' (' + src + ':' + line + ':' + col + ')');
        showBootError('Erreur de chargement', detail);
        return false;
      };
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Promesse rejetée';
        showBootError('Erreur asynchrone', reason);
      });
    })();
  </script>

  <!-- Crisp Industrial / Arcade Fonts with solid system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Russo+One&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="webgl-canvas" aria-label="Vue 3D DESTRUCT THE WALL"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
